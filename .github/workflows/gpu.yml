name: gpu
on:
  push:
    paths: ["gpu/jobs/**"]
  workflow_dispatch:
    inputs:
      job:
        description: "job file under gpu/jobs (or a .py file under gpu/ to run with 'modal run')"
        required: true
permissions:
  contents: write
concurrency: gpu-results
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.4 numpy
      - name: run changed job files on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_TOKEN_SET: ${{ secrets.MODAL_TOKEN_SET }}
        run: |
          # accept either the two secrets, or the whole "modal token set --token-id ak-.. --token-secret as-.." line
          if [ -n "$MODAL_TOKEN_SET" ]; then
            export MODAL_TOKEN_ID=$(echo "$MODAL_TOKEN_SET" | grep -o 'ak-[A-Za-z0-9]*' | head -1)
            export MODAL_TOKEN_SECRET=$(echo "$MODAL_TOKEN_SET" | grep -o 'as-[A-Za-z0-9]*' | head -1)
          fi
          echo "token id present: $([ -n "$MODAL_TOKEN_ID" ] && echo yes || echo no), secret present: $([ -n "$MODAL_TOKEN_SECRET" ] && echo yes || echo no)"
          case "${{ github.event.inputs.job }}" in
            main:*) J="${{ github.event.inputs.job }}"; export OLL_GPU=$(echo "$J" | cut -d: -f2); python gpu/main_app.py start $(echo "$J" | cut -d: -f3- | tr ':' ' '); exit 0;;
            fetch) python gpu/main_app.py fetch; exit 0;;
            deploy) modal deploy gpu/web_app.py; exit 0;;
            vols) modal volume ls oll-main / || true; modal volume ls oll-main /ckpt || true; modal volume ls oll-main /results || true
                  mkdir -p runs/gpu/main; for f in chat.json chat_progress.json chat_train_log.txt; do modal volume get oll-main /results/$f runs/gpu/main/$f --force || true; done
                  pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu || true
                  mkdir -p models; modal volume get oll-main /ckpt/chat.pt runs/gpu/chat_ckpt.pt --force || true; ls -la runs/gpu/main runs/gpu | head -40
                  python - <<'PY' || true
          import os, torch
          p = "runs/gpu/chat_ckpt.pt"
          if os.path.exists(p):
              ck = torch.load(p, map_location="cpu"); print("checkpoint step", ck.get("step"))
              torch.save(dict(config=dict(R=1024, L=8, M=8, RM=512, streams="STREAMS_BIG", trained_steps=ck.get("step")),
                              model={k: (v.half() if v.is_floating_point() else v) for k, v in ck["model"].items()}), "models/oll-chat.pt")
              os.remove(p); print("saved models/oll-chat.pt", os.path.getsize("models/oll-chat.pt"))
          PY
                  git add models/oll-chat.pt 2>/dev/null || true; exit 0;;
            stop) ID=$(modal app list | grep -o 'ap-[A-Za-z0-9]*' | head -1); echo "stopping $ID"; modal app stop "$ID"; exit 0;;
            logs) modal app list | head -14; ID=$(modal app list | grep -o 'ap-[A-Za-z0-9]*' | head -1); echo "app $ID"; (timeout 50 modal app logs "$ID" 2>&1 | grep -v "^\s*$" | tail -80) || true; exit 0;;
            cpu:*) J="${{ github.event.inputs.job }}"; python gpu/main_app.py cpu $(echo "$J" | cut -d: -f2- | tr ':' ' '); exit 0;;
            run:*) J="${{ github.event.inputs.job }}"; export OLL_GPU=$(echo "$J" | cut -d: -f2); python gpu/main_app.py run $(echo "$J" | cut -d: -f3- | tr ':' ' '); exit 0;;
            caps:*) J="${{ github.event.inputs.job }}"; export OLL_GPU=$(echo "$J" | cut -d: -f2); python gpu/main_app.py caps $(echo "$J" | cut -d: -f3- | tr ':' ' '); exit 0;;
            *.py) modal run "gpu/${{ github.event.inputs.job }}"; exit 0;;
          esac
          if [ -n "${{ github.event.inputs.job }}" ]; then JOBS="gpu/jobs/${{ github.event.inputs.job }}"; else
          JOBS=$(git diff --name-only HEAD~1 HEAD -- gpu/jobs | grep '\.json$' || true); fi
          for j in $JOBS; do echo "== $j"; if grep -q '"cmds"' "$j"; then python gpu/multi.py "$j"; else python gpu/launch.py "$j"; fi; done
      - name: commit results
        if: always()
        run: |
          git config user.name "oll-gpu-bot"; git config user.email "oll-gpu-bot@users.noreply.github.com"
          git add runs/gpu || true
          git commit -m "GPU results: ${{ github.sha }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
